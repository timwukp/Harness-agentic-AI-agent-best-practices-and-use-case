<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b8cff"/>
    </marker>
    <marker id="ahg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3ecf8e"/>
    </marker>
    <style>
      .card { fill:#141b33; stroke:#26305a; stroke-width:1.5; }
      .agent { fill:#1b2444; stroke:#5b8cff; stroke-width:2; }
      .title { fill:#e7ecff; font-size:15px; font-weight:650; }
      .sub { fill:#8592c0; font-size:11px; }
      .tiny { fill:#8592c0; font-size:10px; }
      .ok { fill:#3ecf8e; font-size:11px; font-weight:600; }
      .wire { stroke:#5b8cff; stroke-width:2.5; fill:none; stroke-dasharray:7 6; animation:dash 1.1s linear infinite; }
      .wireg { stroke:#3ecf8e; stroke-width:2.5; fill:none; stroke-dasharray:7 6; animation:dash 1.1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-13; } }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="400" fill="#0b1020" rx="14"/>
  <text x="30" y="42" fill="#e7ecff" font-size="17" font-weight="650">Autonomous QA loop — every stage verified end-to-end</text>

  <!-- 1 developer -->
  <rect class="card" x="30" y="120" width="160" height="104" rx="12"/>
  <circle cx="66" cy="156" r="12" fill="none" stroke="#5b8cff" stroke-width="2.4"/>
  <path d="M48,192 C52,174 80,174 84,192" fill="none" stroke="#5b8cff" stroke-width="2.4"/>
  <text class="title" x="100" y="160">Developer</text>
  <text class="sub" x="100" y="177">pushes code</text>
  <text class="ok" x="46" y="212">&#10003; verified</text>

  <!-- 2 ci -->
  <rect class="card" x="238" y="120" width="170" height="104" rx="12"/>
  <circle cx="276" cy="160" r="15" fill="none" stroke="#e17ec3" stroke-width="2.4"/>
  <path d="M276,150 v10 l7,5" stroke="#e17ec3" stroke-width="2.4" fill="none"/>
  <text class="title" x="300" y="156">GitHub</text>
  <text class="sub" x="300" y="173">Actions on PR</text>
  <text class="ok" x="254" y="212">&#10003; verified</text>

  <!-- 3 ui test agent -->
  <rect class="agent" x="456" y="104" width="200" height="136" rx="12"/>
  <rect x="476" y="126" width="30" height="30" rx="7" fill="#5b8cff" opacity="0.85"/>
  <path d="M483,141 l6,6 10,-12" stroke="#0b1020" stroke-width="2.6" fill="none"/>
  <text class="title" x="518" y="139">UI Test Agent</text>
  <text class="sub" x="518" y="156">AgentCore Harness</text>
  <text class="tiny" x="472" y="182">real browser · 17 interaction types</text>
  <text class="tiny" x="472" y="198">35 tests · screenshots as evidence</text>
  <text class="ok" x="472" y="226">&#10003; verified</text>

  <!-- 4 report -->
  <rect class="card" x="704" y="120" width="170" height="104" rx="12"/>
  <path d="M728,146 h20 l8,8 v34 h-28 Z M748,146 v8 h8" fill="none" stroke="#f5b342" stroke-width="2.2"/>
  <text class="title" x="766" y="160">Test report</text>
  <text class="sub" x="766" y="177">JSON + findings</text>
  <text class="ok" x="720" y="212">&#10003; verified</text>

  <!-- 5 bugfix agent -->
  <rect class="agent" x="922" y="104" width="200" height="136" rx="12"/>
  <rect x="942" y="126" width="30" height="30" rx="7" fill="#d95926" opacity="0.9"/>
  <path d="M950,148 l7,-8 m0,8 l-7,-8 m10,1 a7,7 0 1 1 3,10" stroke="#0b1020" stroke-width="2.4" fill="none"/>
  <text class="title" x="984" y="139">Bug-Fix Agent</text>
  <text class="sub" x="984" y="156">AgentCore Harness</text>
  <text class="tiny" x="938" y="182">reads findings + source code</text>
  <text class="tiny" x="938" y="198">emits minimal correct diffs</text>
  <text class="ok" x="938" y="226">&#10003; verified</text>

  <!-- wires forward -->
  <path class="wire" d="M190,172 H232" marker-end="url(#ah)"/>
  <path class="wire" d="M408,172 H450" marker-end="url(#ah)"/>
  <path class="wire" d="M656,172 H698" marker-end="url(#ah)"/>
  <path class="wire" d="M874,172 H916" marker-end="url(#ah)"/>

  <!-- loop back: PR with fix -->
  <path class="wireg" d="M1022,240 C1022,310 400,310 330,230" marker-end="url(#ahg)"/>
  <text class="ok" x="560" y="336">auto-fix commit &#8594; PR re-triggers the loop (capped rounds)</text>

  <!-- ops console link -->
  <text class="tiny" x="30" y="376">Human oversight: the whole loop is monitored, evaluated, and optimized from the open-source ops console &#8594; github.com/timwukp/bedrock-agentcore-agent-ops-console</text>
</svg>
